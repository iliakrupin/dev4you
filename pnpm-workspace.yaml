allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

# Next/styled-jsx allow older transitive versions; pin the first patched
# releases until their dependency ranges move forward.
overrides:
  baseline-browser-mapping: 2.11.0
  browserslist: 4.28.7
  # next 16.3.8 тянет уязвимые транзитивные версии (pnpm audit 21.10.2026); каждое
  # закрепление — в пределах диапазона, который объявляет зависимый пакет.
  sharp: 0.35.5          # next optional ^0.35.4; GHSA для <0.35.5 (high)
  source-map-js: 1.2.2   # postcss ^1.2.1; уязвимы >=1.0.0 <1.2.2 (high)
  '@babel/core': 7.29.7  # styled-jsx; уязвимы <=7.29.0 (low)
